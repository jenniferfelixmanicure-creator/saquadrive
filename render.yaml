databases:
  - name: zerorisco-postgres
    plan: free
    databaseName: zerorisco_db
    user: zerorisco_admin
    region: oregon

services:
  - type: web
    name: saquadrive
    plan: free
    region: oregon
    rootDir: artifacts/api-server
    buildCommand: bash build.sh
    startCommand: node dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: zerorisco-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
