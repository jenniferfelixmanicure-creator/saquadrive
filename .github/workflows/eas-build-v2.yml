name: Build APK v2 (ZeroRisco)

on:
  push:
    branches: [main]
    paths:
      - 'artifacts/zeroriscov2/**'
  workflow_dispatch:

concurrency:
  group: apk-build-v2
  cancel-in-progress: true

jobs:
  build:
    name: Build APK Android v2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Instalar dependencias
        run: pnpm install --no-frozen-lockfile

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Expo Prebuild
        working-directory: artifacts/zeroriscov2
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build APK Debug
        working-directory: artifacts/zeroriscov2/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs=-Xmx4g

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zeroriscov2-debug.apk
          path: artifacts/zeroriscov2/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
