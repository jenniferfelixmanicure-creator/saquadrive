name: EAS Build – saquadrive (Preview APK)

on:
  push:
    branches: [main]
    paths:
      - 'artifacts/saquadrive/**'
  workflow_dispatch:

concurrency:
  group: eas-build-saquadrive
  cancel-in-progress: true

jobs:
  build:
    name: EAS Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Instalar dependências
        run: pnpm install --no-frozen-lockfile

      - name: Instalar EAS CLI
        run: npm install -g eas-cli

      - name: EAS Build (Preview APK)
        working-directory: artifacts/saquadrive
        run: eas build --profile preview --platform android --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
