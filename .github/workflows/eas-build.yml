name: Build APK (Preview)

on:
  push:
    branches: [main]
    paths:
      - 'artifacts/saquadrive/**'
  workflow_dispatch:

concurrency:
  group: apk-build
  cancel-in-progress: true

jobs:
  build:
    name: Build APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Instalar dependências
        run: pnpm install --no-frozen-lockfile

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Expo Prebuild
        working-directory: artifacts/saquadrive
        run: npx expo prebuild --platform android --no-install
      - name: Desativar Nova Arquitetura no gradle.properties
        run: sed -i "s/newArchEnabled=true/newArchEnabled=false/" artifacts/saquadrive/android/gradle.properties

      - name: Build APK Debug
        working-directory: artifacts/saquadrive/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs=-Xmx4g

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zerorisco-preview.apk
          path: artifacts/saquadrive/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
